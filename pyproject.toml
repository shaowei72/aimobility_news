[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aimobility-news"
version = "0.1.0"
description = "AI Mobility News aggregator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "openai>=3.28.0",
    "playwright>=1.63.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = []
